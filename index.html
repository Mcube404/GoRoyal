    .category-card {

      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    
    .category-card:hover {

    }
    
    .live-badge {
      background: #E31837;
      animation: pulse 2s infinite;
    }

      0%, 100% { opacity: 1; }

    }
    
    .bottom-nav {

    .nav-btn {

    .nav-btn:hover {

    .android-nav {

    ::-webkit-scrollbar {
      width: 4px;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #ccc;

  <script>
    const defaultConfig = {
      search_placeholder: "Search GoRoyal.in",
      category_title: "Mobiles & Electronics",
      background_color: "#f5f5f5",
      header_color: "#4ECDC4",
      card_color: "#ffffff",
      text_color: "#374151",
      accent_color: "#FF9900",
      font_family: "Inter",
      font_size: 14
    };

    let config = { ...defaultConfig };

    async function onConfigChange(newConfig) {
      const searchInput = document.getElementById('search-input');
      const categoryTitle = document.getElementById('category-title');
      
      if (searchInput) {
        searchInput.placeholder = newConfig.search_placeholder || defaultConfig.search_placeholder;
      }
      
      if (categoryTitle) {
        categoryTitle.textContent = newConfig.category_title || defaultConfig.category_title;
      }

      // Apply font family
      const fontFamily = newConfig.font_family || defaultConfig.font_family;
      document.body.style.fontFamily = `${fontFamily}, -apple-system, BlinkMacSystemFont, sans-serif`;

      // Apply font size scaling
      const baseSize = newConfig.font_size || defaultConfig.font_size;
      document.querySelectorAll('.category-card span').forEach(el => {
        el.style.fontSize = `${baseSize * 0.75}px`;
      });
      
      if (categoryTitle) {
        categoryTitle.style.fontSize = `${baseSize * 1.1}px`;
      }
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (value) => {
              config.background_color = value;
              window.elementSdk.setConfig({ background_color: value });
            }
          },
          {
            get: () => config.header_color || defaultConfig.header_color,
            set: (value) => {
              config.header_color = value;
              window.elementSdk.setConfig({ header_color: value });
            }
          },
          {
            get: () => config.card_color || defaultConfig.card_color,
            set: (value) => {
              config.card_color = value;
              window.elementSdk.setConfig({ card_color: value });
            }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => {
              config.text_color = value;
              window.elementSdk.setConfig({ text_color: value });
            }
          },
          {
            get: () => config.accent_color || defaultConfig.accent_color,
            set: (value) => {
              config.accent_color = value;
              window.elementSdk.setConfig({ accent_color: value });
            }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.font_family || defaultConfig.font_family,
          set: (value) => {
            config.font_family = value;
            window.elementSdk.setConfig({ font_family: value });
          }
        },
        fontSizeable: {
          get: () => config.font_size || defaultConfig.font_size,
          set: (value) => {
            config.font_size = value;
            window.elementSdk.setConfig({ font_size: value });
          }
        }
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ["search_placeholder", config.search_placeholder || defaultConfig.search_placeholder],
        ["category_title", config.category_title || defaultConfig.category_title]
      ]);
    }

    // Sidebar item click handling
    document.querySelectorAll('.sidebar-item').forEach(item => {
      item.addEventListener('click', function() {
        document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
        this.classList.add('active');
      });
    });

    // Category card click handling
    document.querySelectorAll('.category-card').forEach(card => {
      card.addEventListener('click', function() {
        this.style.transform = 'scale(0.95)';
        setTimeout(() => {
          this.style.transform = '';
        }, 150);
      });
    });

    // Initialize SDK
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }
  </script>
