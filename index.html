<!doctype html>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .status-bar { background: linear-gradient(135deg, #4ECDC4 0%, #44A08D 100%); }
    .search-bar { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

    .sidebar-item { transition: all 0.2s ease; }
    .sidebar-item:hover { background: #f0f0f0; }
    .sidebar-item.active { background: #e8e8e8; border-left: 3px solid #FF9900; }

    .category-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .category-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }

    .live-badge { background: #E31837; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.7} }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }
  </style>
</head>

class="flex-1 text-sm text-gray-700 outline-none bg-transparent">

        <div class="w-12 h-12 mb-1 flex items-center justify-center">

  </div>

</div>

<script>
  const title = document.querySelector('h2');
  const searchInput = document.getElementById('searchInput');
  const cards = document.querySelectorAll('.category-card');

  // Sidebar click + title change
  document.querySelectorAll('.sidebar-item').forEach(item => {
    item.addEventListener('click', function () {
      document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
      this.classList.add('active');
      title.textContent = this.innerText.trim();
    });
  });

  // Card click animation
  cards.forEach(card => {
    card.addEventListener('click', function() {
      this.style.transform = 'scale(0.95)';
      setTimeout(() => this.style.transform = '', 150);
    });
  });

  // 🔎 Search functionality
  searchInput.addEventListener('input', function () {
    const value = this.value.toLowerCase();

    cards.forEach(card => {
      const text = card.innerText.toLowerCase();
      card.style.display = text.includes(value) ? "flex" : "none";
    });
  });
</script>

</body>
