<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity | Shop</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-content">
            <button class="menu-btn mobile-only"><i data-lucide="menu"></i></button>
            <div class="logo">
                <span class="logo-icon"><i data-lucide="zap"></i></span>
                <span class="logo-text">GoGrocy</span>
            </div>
            <div class="search-bar">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" placeholder="Search GoGrocy Products...">
                <i data-lucide="camera" class="camera-icon"></i>
            </div>
            <div class="header-actions desktop-only">
    <button class="icon-btn" id="theme-toggle" title="Toggle theme">
        <i data-lucide="moon" id="theme-icon"></i>
    </button>
    <button class="icon-btn"><i data-lucide="user"></i></button>
    <button class="icon-btn"><i data-lucide="shopping-cart"></i></button>
</div>

        </div>
    </header>

    <!-- Main Layout -->
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <nav class="category-nav">
                <!-- Categories will be injected by JS -->
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="content-header">
                <h2 id="category-title">Mobiles & Electronics</h2>
            </div>
            <div class="product-grid" id="product-grid">
                <!-- Products will be injected by JS -->
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
